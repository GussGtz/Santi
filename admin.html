<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f4f35">
<link rel="icon" href="/icons/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Confirmados · Cumple 8 de Santi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee&family=Contrail+One&family=Open+Sans:wght@400;600;700&display=swap">
<style>
  /* Layout: la lista del equipo. Arriba el marcador con el total, abajo una fila por invitado. */
  :root {
    --pasto: #2f7a4f;
    --pasto-hondo: #1f4f35;
    --sombra: #153a27;
    --oro: #f0b43c;
    --tinta: #1d1d1b;
    --cal: #fbfdf9;
    --cal-suave: #d6e8dc;

    --f-titulo: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
    --f-nombre: "Bungee", "Arial Black", Impact, sans-serif;
    --f-grito: "Contrail One", "Arial Narrow", sans-serif;
    --f-texto: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--f-texto);
    font-size: 1rem;
    line-height: 1.5;
    color: var(--cal);
    background:
      repeating-conic-gradient(from -4deg at 50% 0, var(--pasto-hondo) 0 7deg, var(--sombra) 7deg 14deg),
      var(--pasto-hondo);
  }
  .wrap {
    max-width: 40rem;
    margin-inline: auto;
    padding-inline: 16px;
    padding-block: clamp(1.5rem, 6vw, 3rem) 3rem;
  }
  h1, h2, p { margin: 0; }
  h1 {
    font-family: var(--f-titulo);
    font-weight: 400;
    font-size: clamp(2.4rem, 11vw, 4rem);
    line-height: 1;
    letter-spacing: .04em;
    text-wrap: balance;
  }
  .rotulo {
    font-family: var(--f-grito);
    font-size: 1rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--oro);
  }
  .cabecera { display: grid; gap: .3rem; margin-bottom: 1.5rem; }

  .panel {
    display: grid;
    gap: .9rem;
    padding: clamp(1rem, 4vw, 1.5rem);
    background: var(--tinta);
    border: 3px solid var(--cal);
  }
  .panel h2 {
    font-family: var(--f-titulo);
    font-weight: 400;
    font-size: clamp(1.6rem, 7vw, 2.1rem);
    line-height: 1.05;
    letter-spacing: .03em;
  }
  .panel label { font-weight: 700; }
  .campo { display: grid; gap: .3rem; }
  input {
    width: 100%;
    min-height: 3.25rem;
    padding: .5em .8em;
    border: 3px solid var(--oro);
    border-radius: 0;
    background: var(--cal);
    color: var(--tinta);
    font: 600 1.1rem var(--f-texto);
  }
  input:focus-visible { outline: 3px solid var(--cal); outline-offset: 2px; }
  .boton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 3rem;
    padding: .55em 1.5em;
    border: 2px solid var(--cal);
    border-radius: 999px;
    background: transparent;
    color: var(--cal);
    font: 700 1.05rem var(--f-texto);
    cursor: pointer;
  }
  .boton-principal {
    border: 0;
    background: var(--cal);
    color: var(--pasto);
    box-shadow: 0 6px 0 var(--pasto);
  }
  .boton:disabled { opacity: .6; cursor: progress; }
  .boton:focus-visible { outline: 3px solid var(--oro); outline-offset: 3px; }
  .ayuda { font-size: .92rem; color: var(--cal-suave); }
  .error { font-weight: 700; color: var(--oro); }

  .resumen {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: clamp(.9rem, 4vw, 1.25rem);
    background: var(--tinta);
    border: 3px solid var(--cal);
  }
  .total { display: flex; align-items: baseline; gap: .6rem; }
  .total b {
    font-family: var(--f-nombre);
    font-weight: 400;
    font-size: clamp(2.6rem, 13vw, 4rem);
    line-height: 1;
    color: var(--oro);
    font-variant-numeric: tabular-nums;
  }
  .total span {
    font-family: var(--f-grito);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--cal-suave);
  }
  .acciones { display: flex; flex-wrap: wrap; gap: .6rem; }

  .lista { list-style: none; margin: 1.25rem 0 0; padding: 0; border-top: 3px solid var(--cal); }
  .lista li {
    display: grid;
    grid-template-columns: 2.25rem 1fr;
    gap: .1rem .75rem;
    padding-block: .85rem;
    border-bottom: 2px dashed rgba(251, 253, 249, .45);
  }
  .lista .num {
    grid-row: span 2;
    font-family: var(--f-nombre);
    font-size: 1.15rem;
    color: var(--oro);
    font-variant-numeric: tabular-nums;
  }
  .lista .nombre {
    min-width: 0;
    font-family: var(--f-titulo);
    font-size: clamp(1.5rem, 6.5vw, 1.9rem);
    line-height: 1.05;
    letter-spacing: .03em;
    overflow-wrap: anywhere;
  }
  .lista .dato { font-size: .9rem; color: var(--cal-suave); }
  .estado { margin-top: .75rem; }
  .vacio { margin-top: 1.25rem; color: var(--cal-suave); }
</style>
</head>
<body>
<main class="wrap">
  <header class="cabecera">
    <p class="rotulo">Cumple 8 de Santi</p>
    <h1>Lista de confirmados</h1>
  </header>

  <p class="ayuda" id="cargando">Cargando…</p>

  <!-- Primera vez: crear la contraseña -->
  <form class="panel" id="form-crear" hidden novalidate>
    <h2>Crea tu contraseña</h2>
    <p class="ayuda">Es la primera vez que se abre esta página. La contraseña que pongas aquí será la única forma de ver la lista.</p>
    <div class="campo">
      <label for="clave-nueva">Contraseña (mínimo 8 caracteres)</label>
      <input id="clave-nueva" type="password" autocomplete="new-password" minlength="8">
    </div>
    <div class="campo">
      <label for="clave-repetir">Repite la contraseña</label>
      <input id="clave-repetir" type="password" autocomplete="new-password" minlength="8">
    </div>
    <p class="error" id="error-crear" role="alert" hidden></p>
    <button class="boton boton-principal" id="boton-crear" type="submit">Guardar contraseña</button>
  </form>

  <!-- Entrar -->
  <form class="panel" id="form-entrar" hidden novalidate>
    <h2>Entrar</h2>
    <div class="campo">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password">
    </div>
    <p class="error" id="error-entrar" role="alert" hidden></p>
    <button class="boton boton-principal" id="boton-entrar" type="submit">Ver confirmados</button>
  </form>

  <!-- Lista -->
  <section id="vista" hidden>
    <div class="resumen">
      <p class="total"><b id="total">0</b><span id="total-texto">confirmados</span></p>
      <div class="acciones">
        <button class="boton" id="boton-actualizar" type="button">Actualizar</button>
        <button class="boton" id="boton-salir" type="button">Salir</button>
      </div>
    </div>
    <p class="ayuda estado" id="estado">Se actualiza sola cada 10 segundos.</p>
    <p class="error" id="error-lista" role="alert" hidden></p>
    <p class="vacio" id="vacio" hidden>Todavía nadie ha confirmado.</p>
    <ol class="lista" id="lista"></ol>
  </section>
</main>

<script>
  var SUPABASE_URL = 'https://jnijeaelisxafedeejsq.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_-j5KEXQGEufduDoxLhbdqg_dH9_pM6Y';

  (function () {
    var el = function (id) { return document.getElementById(id); };
    // Código de sesión al azar que entrega Supabase al entrar. Se guarda en este navegador
    // y la sesión sigue abierta hasta pulsar "Salir". La contraseña nunca se guarda.
    var CLAVE_SESION = 'santi-admin-sesion';
    var sesion = null;
    try { sesion = localStorage.getItem(CLAVE_SESION); } catch (e) {}
    function guardarSesion(token) {
      sesion = token;
      try {
        if (token) localStorage.setItem(CLAVE_SESION, token);
        else localStorage.removeItem(CLAVE_SESION);
      } catch (e) {}
    }

    function rpc(nombre, datos) {
      return fetch(SUPABASE_URL + '/rest/v1/rpc/' + nombre, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(datos || {})
      }).then(function (r) {
        return r.json().catch(function () { return null; }).then(function (cuerpo) {
          if (!r.ok) {
            var e = new Error((cuerpo && cuerpo.message) || 'Error ' + r.status);
            e.codigo = cuerpo && cuerpo.code;
            throw e;
          }
          return cuerpo;
        });
      });
    }

    function mostrar(id) {
      ['cargando', 'form-crear', 'form-entrar', 'vista'].forEach(function (x) { el(x).hidden = x !== id; });
    }
    function avisar(id, texto) { el(id).textContent = texto; el(id).hidden = false; }

    function equipo(ua) {
      ua = ua || '';
      var so = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' :
        /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : '';
      var nav = /Edg\//.test(ua) ? 'Edge' : /CriOS|Chrome\//.test(ua) ? 'Chrome' : /FxiOS|Firefox\//.test(ua) ? 'Firefox' :
        /Safari\//.test(ua) ? 'Safari' : '';
      return [so, nav].filter(Boolean).join(' · ');
    }
    var fecha = new Intl.DateTimeFormat('es-MX', {
      timeZone: 'America/Cancun', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'
    });

    function pintar(filas) {
      var lista = el('lista');
      lista.textContent = '';
      el('total').textContent = filas.length;
      el('total-texto').textContent = filas.length === 1 ? 'confirmado' : 'confirmados';
      el('vacio').hidden = filas.length > 0;
      filas.forEach(function (f, i) {
        var li = document.createElement('li');
        var num = document.createElement('span');
        num.className = 'num';
        num.textContent = filas.length - i;
        var nombre = document.createElement('span');
        nombre.className = 'nombre';
        nombre.textContent = f.nombre_completo || '(sin nombre)';
        var dato = document.createElement('span');
        dato.className = 'dato';
        dato.textContent = [f.created_at ? fecha.format(new Date(f.created_at)) : '', equipo(f.dispositivo)]
          .filter(Boolean).join(' · ');
        li.appendChild(num); li.appendChild(nombre); li.appendChild(dato);
        lista.appendChild(li);
      });
    }

    var hora = new Intl.DateTimeFormat('es-MX', { hour: 'numeric', minute: '2-digit', second: '2-digit' });

    function cargarLista() {
      return rpc('admin_lista', { token: sesion }).then(function (filas) {
        el('error-lista').hidden = true;
        pintar(filas || []);
        el('estado').textContent = 'Se actualiza sola cada 10 segundos. Última vez: ' + hora.format(new Date());
        mostrar('vista');
      });
    }

    function cerrar() {
      guardarSesion(null);
      el('lista').textContent = '';
      mostrar('form-entrar');
    }
    function salir() {
      var token = sesion;
      cerrar();
      if (token) rpc('admin_salir', { token: token }).catch(function () {});
    }
    function entrar(clave) {
      return rpc('admin_entrar', { clave: clave }).then(function (token) {
        guardarSesion(token);
        return cargarLista();
      });
    }

    // Actualización automática mientras la lista está abierta y la pestaña a la vista.
    var cargando = false;
    function refrescar() {
      if (!sesion || cargando || document.hidden || el('vista').hidden) return;
      cargando = true;
      cargarLista().catch(function (e) {
        if (e.codigo === '28000') {
          cerrar();
          avisar('error-entrar', 'La sesión se cerró. Vuelve a entrar.');
          return;
        }
        avisar('error-lista', 'Sin conexión. Se volverá a intentar en unos segundos.');
      }).then(function () { cargando = false; });
    }
    setInterval(refrescar, 10000);
    document.addEventListener('visibilitychange', refrescar);

    function mensajeDeError(e) {
      return e.codigo === '28P01' ? 'Contraseña incorrecta.' : 'No se pudo conectar. Inténtalo de nuevo.';
    }

    el('form-entrar').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var valor = el('clave').value;
      if (!valor) { avisar('error-entrar', 'Escribe la contraseña.'); return; }
      el('error-entrar').hidden = true;
      el('boton-entrar').disabled = true;
      entrar(valor).then(function () {
        el('clave').value = '';
      }).catch(function (e) {
        avisar('error-entrar', mensajeDeError(e));
      }).then(function () { el('boton-entrar').disabled = false; });
    });

    el('form-crear').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var a = el('clave-nueva').value, b = el('clave-repetir').value;
      if (a.length < 8) { avisar('error-crear', 'La contraseña debe tener al menos 8 caracteres.'); return; }
      if (a !== b) { avisar('error-crear', 'Las contraseñas no coinciden.'); return; }
      el('error-crear').hidden = true;
      el('boton-crear').disabled = true;
      rpc('admin_crear_clave', { clave: a }).then(function (creada) {
        if (!creada) {
          mostrar('form-entrar');
          avisar('error-entrar', 'Ya existía una contraseña. Entra con ella.');
          return;
        }
        el('clave-nueva').value = el('clave-repetir').value = '';
        return entrar(a);
      }).catch(function () {
        avisar('error-crear', 'No se pudo guardar. Inténtalo de nuevo.');
      }).then(function () { el('boton-crear').disabled = false; });
    });

    el('boton-actualizar').addEventListener('click', function () {
      var b = el('boton-actualizar');
      b.disabled = true;
      cargarLista().catch(function (e) { avisar('error-lista', mensajeDeError(e)); })
        .then(function () { b.disabled = false; });
    });

    el('boton-salir').addEventListener('click', salir);

    function inicio() {
      rpc('admin_tiene_clave').then(function (tiene) {
        mostrar(tiene ? 'form-entrar' : 'form-crear');
      }).catch(function () {
        el('cargando').textContent = 'No se pudo conectar con la base de datos. Recarga la página.';
      });
    }
    if (sesion) {
      // Sesión guardada: entra directo. Solo se descarta si Supabase dice que ya no es válida.
      cargarLista().catch(function (e) {
        if (e.codigo === '28000') { guardarSesion(null); inicio(); return; }
        el('cargando').textContent = 'No se pudo conectar con la base de datos. Recarga la página.';
      });
    } else {
      inicio();
    }
  })();
</script>
</body>
</html>
